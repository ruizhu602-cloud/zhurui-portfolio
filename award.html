<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证书查看</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;padding:28px}.shell{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#86868b}.title{font-size:28px;margin:8px 0 0;letter-spacing:-.04em}.button{display:inline-flex;padding:12px 18px;border-radius:999px;background:#0071e3;color:#fff;text-decoration:none;font-size:14px;white-space:nowrap}.paper{background:#fff;border-radius:22px;padding:16px;box-shadow:0 18px 55px #00000012}.paper img{display:block;width:100%;height:auto;border-radius:12px}.back{display:inline-block;margin-top:20px;color:#0071e3;text-decoration:none;font-size:14px}@media(max-width:600px){body{padding:14px}.top{align-items:flex-start}.title{font-size:22px}.button{padding:10px 13px}}

</head><body><main class="shell"><div class="top"><div><div class="eyebrow">RECOGNITION / CERTIFICATE</div><h1 class="title" id="award-title">证书查看</h1></div><a class="button" id="award-download" download>下载原证书 ↓</a></div><div class="paper"><img id="award-image" alt="证书预览"></div><a class="back" href="index.html#awards">← 返回奖项</a></main><script>const q=new URLSearchParams(location.search),pdf=q.get('pdf'),image=q.get('image'),title=q.get('title');if(title)document.title=title+' · 证书';document.querySelector('#award-title').textContent=title||'证书查看';const img=document.querySelector('#award-image');if(image)img.src='assets/'+image;img.alt=(title||'证书')+'预览';const dl=document.querySelector('#award-download');if(pdf){dl.href='assets/'+pdf;dl.download=pdf}</script></body></html>
