<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" role="img" aria-labelledby="title desc">
  <title id="title">敷尔佳护肤产品领取要求</title>
  <desc id="desc">采用同系列绿色与乳白编辑排版的信息说明图。</desc>
  <rect width="800" height="1800" fill="#F3F1E8"/>
  <rect x="0" y="0" width="24" height="1800" fill="#0B5149"/>
  <text x="72" y="92" fill="#0B5149" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2">敷尔佳</text>
  <text x="728" y="92" text-anchor="end" fill="#5A766E" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">活动参与说明</text>
  <path d="M72 124H728" stroke="#0B5149" stroke-opacity=".25" stroke-width="2"/>
  <text x="66" y="300" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="88" font-weight="700">护肤产品</text>
  <text x="66" y="400" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="88" font-weight="700">领取要求</text>
  <rect x="70" y="444" width="660" height="8" fill="#D8ED69"/>
  <text x="70" y="524" fill="#5A766E" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">请按以下要求参与活动</text>
  <g>
    <text x="70" y="670" fill="#0B5149" font-family="Arial, sans-serif" font-size="54" font-weight="700">01</text>
    <text x="192" y="665" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="39" font-weight="700">现场拍摄（任选一种）</text>
    <path d="M70 710H728" stroke="#0B5149" stroke-opacity=".2" stroke-width="2"/>
    <text x="192" y="790" fill="#0B5149" font-family="Arial, sans-serif" font-size="61" font-weight="700">3–5</text>
    <text x="386" y="790" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="32">张现场照片</text>
    <text x="192" y="850" fill="#5A766E" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="27">或</text>
    <text x="192" y="930" fill="#0B5149" font-family="Arial, sans-serif" font-size="61" font-weight="700">15</text>
    <text x="304" y="930" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="32">秒以上现场视频</text>
  </g>
  <g>
    <text x="70" y="1090" fill="#0B5149" font-family="Arial, sans-serif" font-size="54" font-weight="700">02</text>
    <text x="192" y="1085" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="39" font-weight="700">抖音 + 小红书</text>
    <path d="M70 1130H728" stroke="#0B5149" stroke-opacity=".2" stroke-width="2"/>
    <text x="192" y="1210" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="29">两个平台均需发布</text>
  </g>
  <g>
    <text x="70" y="1370" fill="#0B5149" font-family="Arial, sans-serif" font-size="54" font-weight="700">03</text>
    <text x="192" y="1365" fill="#0B5149" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="39" font-weight="700">添加话题</text>
    <path d="M70 1410H728" stroke="#0B5149" stroke-opacity=".2" stroke-width="2"/>
    <text x="192" y="1480" fill="#0B5149" font-family="Arial, sans-serif" font-size="25">#敷尔佳青春不脸红</text>
    <text x="192" y="1540" fill="#0B5149" font-family="Arial, sans-serif" font-size="25">#敷尔佳城市逃逸计划</text>
    <text x="192" y="1600" fill="#0B5149" font-family="Arial, sans-serif" font-size="25">#湖南城市学院美院队</text>
  </g>
  <rect x="72" y="1680" width="656" height="1" fill="#0B5149" opacity=".25"/>
  <text x="72" y="1734" fill="#0B5149" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">敷尔佳 / 青年自信主题视觉</text>
  <text x="728" y="1734" text-anchor="end" fill="#5A766E" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">活动信息设计</text>
</svg>
