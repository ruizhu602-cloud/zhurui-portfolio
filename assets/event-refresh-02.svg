<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">敷尔佳青年自信主题视觉：接纳自己</title>
  <desc id="desc">深绿底色上的开放圆环与明亮文字，表达接纳自己、自带高光。</desc>
  <rect width="1536" height="1024" fill="#0B5149"/>
  <circle cx="1042" cy="510" r="355" fill="none" stroke="#D8ED69" stroke-width="3"/>
  <circle cx="1042" cy="510" r="288" fill="none" stroke="#F3F1E8" stroke-opacity=".55" stroke-width="2"/>
  <path d="M1042 132a378 378 0 0 1 340 214" fill="none" stroke="#D8ED69" stroke-width="18"/>
  <circle cx="1380" cy="346" r="18" fill="#D8ED69"/>
  <text x="96" y="108" fill="#F3F1E8" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">敷尔佳</text>
  <text x="1440" y="108" text-anchor="end" fill="#D8ED69" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">青年自信主题视觉</text>
  <path d="M96 145H1440" stroke="#F3F1E8" stroke-opacity=".35" stroke-width="2"/>
  <text x="95" y="410" fill="#F3F1E8" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="148" font-weight="700" letter-spacing="3">接纳自己</text>
  <text x="102" y="525" fill="#D8ED69" font-family="Arial, sans-serif" font-size="28" letter-spacing="6">ACCEPT YOURSELF</text>
  <path d="M98 582H785" stroke="#F3F1E8" stroke-opacity=".5" stroke-width="2"/>
  <text x="95" y="730" fill="#F3F1E8" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="116" font-weight="700" letter-spacing="2">自带高光</text>
  <text x="100" y="902" fill="#F3F1E8" font-family="Arial, sans-serif" font-size="17" letter-spacing="4">敷尔佳 / 活动视觉延展</text>
</svg>
